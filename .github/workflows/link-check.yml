name: link check and update readme

on:
  schedule:
    - cron: '0 15 * * *' # 日本時間の午前0時
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Advanced Link Check
        run: |
          LAST_UPDATE="2026-03-27"
          NEXT_UPDATE=$(date -d "$LAST_UPDATE + 60 days" +%Y-%m-%d)

          CURRENT_DATE=$(date +%Y-%m-%d)
          DIFF=$(( ($(date -d "$CURRENT_DATE" +%s) - $(date -d "$LAST_UPDATE" +%s)) / 86400 ))

          # # ページの中身を取得して、特定のキーワード（例: neon）が含まれているか検索するわ
          # # -L はリダイレクトを追いかけるオプションよ
          # LINK_URL="https://gemini.google.com/share/935ca94636c9"
          # PAGE_CONTENT=$(curl -sL "$LINK_URL")

          # # "neon" という単語が含まれているかチェック
          # if echo "$PAGE_CONTENT" | grep -qi "neon"; then
          #   LINK_ALIVE=true
          # else
          #   LINK_ALIVE=false
          # fi

          # if [ "$LINK_ALIVE" = false ]; then
          #   STATUS="🔴 **【リンク切れ検知】** 共有リンクが失効している可能性があります(share link expired)  \n最終更新日(last update): $LAST_UPDATE"
          # elif [ $DIFF -ge 60 ]; then
          #   STATUS="🟡 **まもなくリンク切れ** 共有リンク(share link) 最終更新日(last update): $LAST_UPDATE ($DIFF 日経過)  \n次回更新予定日(next update): $NEXT_UPDATE"
          # else
          #   STATUS="🟢 共有リンク(share link) 最終更新日(last update): $LAST_UPDATE ($DIFF 日経過)  \n次回更新予定日(next update): $NEXT_UPDATE"
          # fi

          # DIFFが1なら"day"、それ以外（0や2以上）なら"days"を代入
          UNIT=$([ "$DIFF" -eq 1 ] && echo "day" || echo "days")

          STATUS="share link last update: $LAST_UPDATE ($DIFF $UNIT ago)"

          # 魔法のsedコマンド（エスケープ版）
          sed -i "/STATUS_START/,/STATUS_END/c\\\x3c\x21\x2d\x2d STATUS_START \x2d\x2d\x3e\n$STATUS  \n\x3c\x21\x2d\x2d STATUS_END \x2d\x2d\x3e" README.md

      - name: Commit and Push
        run: |
          git config --local user.email "240400715+neon-aiart@users.noreply.github.com"
          git config --local user.name "neon-aiart"
          git add README.md
          git commit -m "Update link expiry status: $(date +%Y-%m-%d)" || exit 0
          git push
